{% set name = "mne-python" %}
{% set version = "1.13.0" %}
{% set sha256 = "9308523df88bd6fdf6e60af07cdb459eac079c93dbc48032de30653e393e1344" %}
{% set build = 0 %}
{% set python_min = "3.11" %}

# Adapted from https://github.com/conda-forge/vtk-feedstock/blob/main/recipe/meta.yaml
# PySide6 is higher priority than PyQt5 in line with matplotlib
{% set build = build + 200 %}  # [build_variant == "pyside6"]
{% set build = build + 100 %}  # [build_variant == "pyqt"]

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/m/mne/mne-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: {{ build }}
  # outputs are noarch, so build once; is_python_min is zipped with python in the
  # global pinning, so this tracks conda-forge's minimum instead of a stale literal
  skip: true  # [not is_python_min]

outputs:
  - name: mne-base
    build:
      noarch: python
      script: python -m pip install --no-deps . -vv
      entry_points:
        - mne = mne.commands.utils:main

    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
      host:
        - python {{ python_min }}
        - pip
        - hatchling
        - hatch-vcs
      run:
        - python >={{ python_min }}
        - decorator >=5.1
        - jinja2 >=3.1
        - lazy_loader >=0.3
        - matplotlib-base >=3.9
        - numpy >=2.1,<3
        - packaging
        - pooch >=1.5
        - scipy >=1.14
        - tqdm >=4.66

    test:
      imports:
        - mne
      commands:
        - pip check  # [not win]
        - mne --version
      requires:
        - python {{ python_min }}
        - pip

  - name: mne
    build:
      noarch: python
      string: "osx_{{ build_variant }}_h{{ PKG_HASH }}_{{ build }}"  # [osx]
      string: "linux_{{ build_variant }}_h{{ PKG_HASH }}_{{ build }}"  # [linux]

    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage('mne-base', max_pin="x.x.x.x") }}
        - __osx  # [osx]
        - antio >=0.5.0
        - curryreader >=0.1.2
        - darkdetect
        - defusedxml
        - dipy >=1.9
        - edfio >=0.4.10
        - eeglabio
        - filelock >=3.18.0
        - h5io >=0.2.4
        - h5py >=2.4
        - imageio >=2.6.1
        - imageio-ffmpeg >=0.4.1
        - ipyevents
        - ipympl
        - ipython >=2.0,!=8.7.0
        - ipywidgets
        - jamica >=0.3.0
        - joblib >=0.8
        - jupyter
        - mffpy >=0.11.0
        - mne-qt-browser >=0.6
        - nest-asyncio2
        - nibabel >=5.2
        - nilearn >=0.10
        - numba >=0.60
        - openmeeg >=2.5.7
        - pandas >=2.2,!=3.0.4
        - pillow
        - pyarrow
        - pybv
        - pymatreader
        - pymef
        - pyobjc-framework-cocoa >=5.2.0  # [osx]  # for setting Dock icons etc
        - python-neo
        - python-picard >=0.4
        - pyvista >=0.44
        - pyvistaqt >=0.11
        - qdarkstyle >=3.2.2
        - qtpy
        - scikit-learn >=1.5
        - sip
        - snirf
        - statsmodels >=0.6
        - threadpoolctl
        - traitlets
        - trame
        - trame-pyvista
        - trame-vtk
        - trame-vuetify !=3.2.3
        - vtk >=9.2
        - xlrd
        - pyqt  # [build_variant == "pyqt"]
        - pyside6 !=6.7.0,!=6.8.0,!=6.8.0.1,!=6.9.1  # [build_variant == "pyside6"]

    test:
      imports:
        - mne
      commands:
        - pip check  # [not win]
        - mne --version
      requires:
        - python {{ python_min }}
        - pip
        # Try to speed up the solver
        - pyqt =5.15.11  # [build_variant == "pyqt"]
        - qt-main =5.15.15  # [build_variant == "pyqt"]
        - pyside6 =6.8.3  # [build_variant == "pyside6"]
        - qt6-main =6.8.3

about:
  home: http://mne.tools
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: MNE-Python is a software for MEG and EEG data analysis.
  description: |
    The main package for MNE-Python is named `mne` in conda-forge and should
    be suitable for most users. The conda recipe produces the following:

    - `mne`: should be installed for full functionality including 3D visualization.
    - `mne-base`: only pulls dependencies for basic functionality and 2D visualization.
  doc_url: http://mne.tools
  dev_url: https://github.com/mne-tools/mne-python

extra:
  recipe-maintainers:
    - larsoner
    - christianbrodbeck
    - hoechenberger
